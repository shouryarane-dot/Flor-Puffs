<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLŌR</title>
<meta name="description" content="FLŌR — Nature, elevated. Coming soon.">
<meta property="og:title" content="FLŌR">
<meta property="og:description" content="Nature, elevated. Coming soon.">
<meta name="theme-color" content="#FAF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#FAF6EF;
    color:#37302A;
    font-family:'Jost',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:300;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 28px;
    text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .mark{
    font-family:'Fraunces',Georgia,serif;
    font-weight:300;
    font-size:clamp(46px,11vw,86px);
    letter-spacing:.30em;
    padding-left:.30em;
    line-height:1;
  }
  .tagline{
    margin-top:30px;
    font-size:clamp(15px,2.4vw,19px);
    letter-spacing:.05em;
    color:#5C5148;
  }
  .rule{
    width:40px;
    height:1px;
    background:#A98B5D;
    margin:44px auto;
  }
  .soon{
    font-size:11.5px;
    letter-spacing:.30em;
    text-transform:uppercase;
    color:#A98B5D;
  }
  .contact{
    margin-top:22px;
    font-size:14.5px;
    color:#5C5148;
    line-height:1.9;
  }
  .contact a{
    color:#37302A;
    text-decoration:none;
    border-bottom:1px solid rgba(55,48,42,.28);
    padding-bottom:1px;
    transition:border-color .3s ease,color .3s ease;
  }
  .contact a:hover{color:#B26545;border-bottom-color:#B26545}

  main{animation:fade 1.5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
  <main>
    <h1 class="mark">FLŌR</h1>
    <p class="tagline">Nature, elevated.</p>
    <div class="rule"></div>
    <p class="soon">Coming soon</p>
    <p class="contact">
      For any questions,<br>
      <a href="mailto:hello@florpuffs.com">hello@florpuffs.com</a>
    </p>
  </main>
</body>
</html>
